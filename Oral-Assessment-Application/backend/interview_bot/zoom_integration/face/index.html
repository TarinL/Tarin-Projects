<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>Interview Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#06080d;
    --bg-1:#0c111c;
    --ink:#eaf2ff;
    --muted:#6b7a93;
    --c-core:#5ff2d6;   /* teal */
    --c-mid:#39b6ff;    /* cyan-blue */
    --c-edge:#8a6bff;   /* violet */
    --c-warm:#ffb27a;   /* speaking accent */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-0)}
  .stage{
    position:absolute;top:50%;left:50%;width:1280px;height:720px;transform-origin:center center;
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(57,182,255,0.10), transparent 60%),
      radial-gradient(90% 120% at 50% 120%, rgba(138,107,255,0.10), transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0));
    font-family:"Space Mono",ui-monospace,monospace;
    color:var(--ink);
  }
  /* faint grain/vignette for depth */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(140% 100% at 50% 45%, transparent 55%, rgba(0,0,0,0.55));
  }
  canvas{position:absolute;inset:0;width:1280px;height:720px;display:block}

  .name{
    position:absolute;left:0;right:0;top:42px;text-align:center;
    font-family:"Instrument Serif",Georgia,serif;
    font-size:52px;letter-spacing:0.5px;color:var(--ink);
    text-shadow:0 2px 30px rgba(57,182,255,0.25);
  }
  .name em{font-style:italic;color:var(--c-core)}

  .status{
    position:absolute;left:0;right:0;bottom:46px;text-align:center;z-index:6;
  }
  .pill{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 22px;border-radius:999px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(6px);
    font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
    transition:color .4s ease,border-color .4s ease;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;background:var(--muted);
    box-shadow:0 0 0 0 rgba(95,242,214,0);
  }
  /* state styling */
  .stage[data-state="ready"]     .pill{color:#bfe9ff;border-color:rgba(95,242,214,.35)}
  .stage[data-state="ready"]     .dot{background:var(--c-core);animation:breathe 2.4s ease-in-out infinite}
  .stage[data-state="listening"] .pill{color:#bfe9ff;border-color:rgba(57,182,255,.35)}
  .stage[data-state="listening"] .dot{background:var(--c-mid);animation:breathe 2.4s ease-in-out infinite}
  .stage[data-state="speaking"]  .pill{color:#ffe0c4;border-color:rgba(255,178,122,.4)}
  .stage[data-state="speaking"]  .dot{background:var(--c-warm)}
  .stage[data-state="thinking"]  .pill{color:#d9cfff;border-color:rgba(138,107,255,.4)}
  .stage[data-state="thinking"]  .dot{background:var(--c-edge);animation:blink 1s steps(2,end) infinite}
  .stage[data-state="completed"] .pill{color:#bdf5d6;border-color:rgba(110,231,183,.5)}
  .stage[data-state="completed"] .dot{background:#6ee7b7}
  .stage[data-state="failed"]    .pill{color:#ffc9cf;border-color:rgba(255,126,138,.45)}
  .stage[data-state="failed"]    .dot{background:#ff7e8a}

  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(57,182,255,.45)}50%{box-shadow:0 0 0 9px rgba(57,182,255,0)}}
  @keyframes blink{50%{opacity:.25}}

  /* ── speech captions (latest exchange) ───────────────────────────────────── */
  .caption{
    position:absolute;left:50%;transform:translateX(-50%);
    width:880px;max-width:880px;padding:14px 24px;border-radius:16px;z-index:4;
    background:rgba(8,12,20,0.60);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.08);text-align:center;
    transition:opacity .35s ease;
  }
  .caption .lbl{
    font-size:11px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px;
  }
  .caption .txt{
    font-family:"Instrument Serif",Georgia,serif;font-size:25px;line-height:1.35;
    color:var(--ink);
  }
  .caption.empty{opacity:0}
  #botCaption{top:142px}
  #botCaption .lbl{color:#ffe0c4}
  #studentCaption{bottom:118px}
  #studentCaption .lbl{color:#bfe9ff}
  #studentCaption .txt{color:#dcefff}
  #studentCaption.partial .txt{opacity:.65;font-style:italic}
</style>
</head>
<body>
  <div class="stage" id="stage" data-state="ready">
    <canvas id="orb" width="1280" height="720"></canvas>
    <div class="name">Interview <em>Assistant</em></div>

    <div class="caption empty" id="botCaption">
      <div class="lbl">Interviewer</div>
      <div class="txt" id="botText"></div>
    </div>
    <div class="caption empty" id="studentCaption">
      <div class="lbl">Student</div>
      <div class="txt" id="studentText"></div>
    </div>

    <div class="status">
      <span class="pill"><span class="dot"></span><span id="statusText">Ready</span></span>
    </div>
  </div>

<script>
(() => {
  const cv = document.getElementById('orb');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const statusText = document.getElementById('statusText');
  const CX = 640, CY = 360, BASE_R = 126;

  // human-readable status labels
  const LABELS = {ready:'Ready to start', listening:'Listening', speaking:'Speaking', thinking:'Thinking',
                  completed:'Interview complete', failed:'Session ended'};

  // ---- public control API ---------------------------------------------------
  // Drive these from your app over whatever channel you like.
  let state = 'ready';                // 'ready' | 'listening' | 'speaking' | 'thinking'
  const api = {
    setState(s){ state = s; stage.dataset.state = s;
      statusText.textContent = LABELS[s] || (s.charAt(0).toUpperCase()+s.slice(1)); },
    // Hook real audio so the orb reacts to the bot's actual voice:
    attachAudio(el){ try{ wireSource(audioCtx().createMediaElementSource(el), true);}catch(e){console.warn(e);} },
    attachStream(stream){ try{ wireSource(audioCtx().createMediaStreamSource(stream), false);}catch(e){console.warn(e);} },
    setDemo(on){ demo = on; },
    stopDemo(){ demo = false; if(demoTimer){ clearInterval(demoTimer); demoTimer = null; } }
  };
  window.botFace = api;

  // ---- audio analysis --------------------------------------------------------
  let AC, analyser, freq, haveAudio = false, demo = true;
  function audioCtx(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
  function wireSource(node, alsoToOutput){
    const ac = audioCtx();
    analyser = ac.createAnalyser();
    analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.78;
    freq = new Uint8Array(analyser.frequencyBinCount);
    node.connect(analyser);
    if(alsoToOutput) analyser.connect(ac.destination); // keep audio audible in the call
    haveAudio = true; demo = false;
  }

  // amplitude 0..1 — real if audio attached, otherwise synthesized for the demo
  let env = 0, t = 0;
  function amplitude(dt){
    let target = 0;
    if(haveAudio && analyser){
      analyser.getByteFrequencyData(freq);
      let s = 0; for(let i=0;i<freq.length;i++) s += freq[i];
      target = (s/freq.length)/180;
    } else {
      if(state === 'speaking'){
        // layered cadence to mimic speech rhythm
        const a = Math.sin(t*7.3), b = Math.sin(t*11.7+1.3), c = Math.sin(t*19.1+0.7);
        target = Math.max(0,(a*0.5+b*0.3+c*0.2))*0.7 + 0.15 + Math.random()*0.06;
      } else if(state === 'thinking'){
        target = 0.18 + Math.sin(t*2.1)*0.05;
      } else if(state === 'completed'){
        target = 0.12 + Math.sin(t*0.9)*0.04;   // calm, settled breathing
      } else if(state === 'failed'){
        target = 0.05;                            // dim and static
      } else { // listening / ready
        target = 0.10 + Math.sin(t*1.3)*0.03;
      }
    }
    target = Math.min(1, Math.max(0, target));
    env += (target - env) * Math.min(1, dt*12);
    return env;
  }

  function palette(){
    if(state==='speaking') return ['#5ff2d6','#ffb27a','#ff7ea8'];
    if(state==='thinking') return ['#8a6bff','#39b6ff','#5ff2d6'];
    if(state==='completed') return ['#6ee7b7','#5ff2d6','#39b6ff'];
    if(state==='failed') return ['#ff8a98','#b06a78','#6b7a93'];
    return ['#5ff2d6','#39b6ff','#8a6bff'];
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now; t += dt;
    const amp = amplitude(dt);
    ctx.clearRect(0,0,1280,720);

    const cols = palette();

    // outer reactive rings
    ctx.save(); ctx.translate(CX,CY);
    for(let r=0;r<3;r++){
      const ringR = BASE_R + 46 + r*40 + amp*70;
      ctx.beginPath();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = cols[r%cols.length];
      ctx.globalAlpha = (0.16 - r*0.04) + amp*0.18;
      // wobble the ring with frequency-ish noise
      const pts = 96;
      for(let i=0;i<=pts;i++){
        const ang = (i/pts)*Math.PI*2;
        const wob = Math.sin(ang*(4+r) + t*(1.5+r))* (4+amp*22);
        const rr = ringR + wob;
        const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();

    // glow
    ctx.save(); ctx.translate(CX,CY);
    const glowR = BASE_R + 60 + amp*120;
    const g = ctx.createRadialGradient(0,0,BASE_R*0.3,0,0,glowR);
    g.addColorStop(0, hexA(cols[0], 0.55));
    g.addColorStop(0.4, hexA(cols[1], 0.22));
    g.addColorStop(1, hexA(cols[2], 0));
    ctx.globalAlpha = 0.9; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,glowR,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // core orb with morphing edge
    ctx.save(); ctx.translate(CX,CY);
    const coreR = BASE_R + amp*28;
    ctx.beginPath();
    const pts = 120;
    for(let i=0;i<=pts;i++){
      const ang=(i/pts)*Math.PI*2;
      const wob = Math.sin(ang*3 + t*1.8)*6 + Math.sin(ang*7 - t*2.4)*(3+amp*14);
      const rr = coreR + wob;
      const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    const cg = ctx.createRadialGradient(-coreR*0.3,-coreR*0.3,coreR*0.1,0,0,coreR*1.1);
    cg.addColorStop(0,'#ffffff');
    cg.addColorStop(0.3,cols[0]);
    cg.addColorStop(0.75,cols[1]);
    cg.addColorStop(1,hexA(cols[2],0.9));
    ctx.fillStyle = cg;
    ctx.shadowColor = hexA(cols[1],0.6); ctx.shadowBlur = 40+amp*60;
    ctx.fill();
    ctx.restore();

    // specular highlight
    ctx.save(); ctx.translate(CX,CY);
    ctx.globalAlpha = 0.5;
    const hg = ctx.createRadialGradient(-coreR*0.35,-coreR*0.4,2,-coreR*0.35,-coreR*0.4,coreR*0.7);
    hg.addColorStop(0,'rgba(255,255,255,0.9)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(-coreR*0.3,-coreR*0.35,coreR*0.7,0,Math.PI*2); ctx.fill();
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function hexA(hex,a){
    const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  // browsers often require a resume on first interaction; bot env usually fine
  document.addEventListener('click', ()=>{ if(AC && AC.state==='suspended') AC.resume(); });

  api.setState('ready');
  requestAnimationFrame(frame);

  // --- DEMO auto-cycle so it looks alive before a live connection -------------
  // Stops automatically on the first message from the bot (see connector below).
  let demoStates = ['ready','listening','thinking','speaking','speaking','listening'];
  let di = 0;
  let demoTimer = setInterval(()=>{ if(demo){ api.setState(demoStates[di % demoStates.length]); di++; } }, 4000);
})();

// ---- live connector: subscribe to the bot's face channel --------------------
(() => {
  const params = new URLSearchParams(location.search);
  const wsUrl = params.get('ws') || 'ws://localhost:8767';

  const nameEl    = document.querySelector('.name');
  const botCap     = document.getElementById('botCaption');
  const botTextEl  = document.getElementById('botText');
  const stuCap     = document.getElementById('studentCaption');
  const stuTextEl  = document.getElementById('studentText');

  let started = false;
  function onFirstMessage(){
    if(started) return;
    started = true;
    if(window.botFace && window.botFace.stopDemo) window.botFace.stopDemo();
  }

  function setCaption(cap, textEl, text){
    textEl.textContent = text || '';
    cap.classList.toggle('empty', !text);
  }

  function handle(ev){
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    onFirstMessage();
    switch(msg.type){
      case 'state':
        if(window.botFace) window.botFace.setState(msg.state);
        break;
      case 'bot_text':
        setCaption(botCap, botTextEl, msg.text);
        // a new bot line supersedes the previous student answer on screen
        setCaption(stuCap, stuTextEl, '');
        stuCap.classList.remove('partial');
        break;
      case 'student_text':
        setCaption(stuCap, stuTextEl, msg.text);
        stuCap.classList.toggle('partial', !!msg.partial);
        break;
      case 'meta':
        if(msg.name) nameEl.innerHTML = 'Interviewing <em>' + msg.name + '</em>';
        break;
    }
  }

  function connect(){
    let ws;
    try{ ws = new WebSocket(wsUrl); }
    catch(e){ setTimeout(connect, 2000); return; }
    ws.onmessage = handle;
    ws.onclose = () => setTimeout(connect, 2000);  // auto-reconnect
    ws.onerror = () => { try{ ws.close(); }catch(e){} };
  }
  connect();
})();

// ---- scale the fixed 1280x720 stage to fit any viewport (no-op at camera size) ---
(() => {
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
